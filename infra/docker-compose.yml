services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: delayance-postgres
    environment:
      POSTGRES_USER: delayance
      POSTGRES_PASSWORD: delayance
      POSTGRES_DB: delayance
    ports:
      - '58433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U delayance -d delayance']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: delayance-redis
    ports:
      - '64380:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: delayance-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: delayance
      MINIO_ROOT_PASSWORD: delayance-secret
    ports:
      - '59002:9000'
      - '59003:9001'
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  minio-init:
    image: minio/mc:latest
    container_name: delayance-minio-init
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      mc alias set local http://minio:9000 delayance delayance-secret;
      mc mb --ignore-existing local/delayance;
      exit 0;
      "

  collabora:
    # Pin this digest after the WOPI/bridge compatibility suite has been run.
    image: collabora/code:24.04.13.3.1
    container_name: delayance-collabora
    environment:
      aliasgroup1: http://host.docker.internal:48722
      extra_params: >-
        --o:ssl.enable=false
        --o:ssl.termination=false
        --o:welcome.enable=false
        --o:storage.wopi.host[0]=host.docker.internal
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - '9980:9980'
    cap_add:
      - MKNOD
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  minio_data:
